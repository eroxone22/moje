name: Build combined EPG (Czech and Hungarian guide sources)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-epg.yml"
  schedule:
    - cron: "25 3 * * *"

permissions:
  contents: write

concurrency:
  group: combined-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out iptv-org EPG grabber
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: upstream-epg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream-epg/package-lock.json

      - name: Install grabber dependencies
        working-directory: upstream-epg
        run: npm ci

      - name: Download six EPG sources into one XMLTV file
        working-directory: upstream-epg
        run: npm run grab -- --sites=mujtvprogram.cz,mediaklikk.hu,m.tv.sms.cz,port.hu,tvmusor.hu,webtv.sk --output=../epg/epg.xml --days=2 --maxConnections=3

      - name: Validate XMLTV output
        run: |
          test -s epg/epg.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("epg/epg.xml").getroot()
          assert root.tag == "tv", f"Unexpected root: {root.tag}"
          channels = root.findall("channel")
          programmes = root.findall("programme")
          assert channels, "No channels found"
          assert programmes, "No programmes found"
          print(f"Validated {len(channels)} channels and {len(programmes)} programmes")
          PY

      - name: Commit updated guide
        run: |
          git add epg/epg.xml
          if git diff --cached --quiet -- epg/epg.xml; then
            echo "Guide unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update combined six-source EPG"
          git push
